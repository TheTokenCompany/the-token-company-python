[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-token-company"
version = "0.4.0"
description = "Python SDK for The Token Company — compress LLM prompts to reduce costs and latency"
readme = "README.md"
license = "MIT"
authors = [{ name = "The Token Company", email = "support@thetokencompany.com" }]
requires-python = ">=3.10"
keywords = ["llm", "compression", "tokens", "ai", "prompt-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://thetokencompany.com"
Documentation = "https://thetokencompany.com/docs"
Repository = "https://github.com/TheTokenCompany/the-token-company-python"

[tool.hatch.build.targets.wheel]
packages = ["src/thetokencompany"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
